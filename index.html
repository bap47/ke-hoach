<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kế hoạch</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">:root{--accent:#5E6AD2;--bg:#FFFFFF;--side:#F7F7F8;--panel:#FFFFFF;--hover:rgba(0,0,0,.04);--sel:rgba(0,0,0,.06);--ink:#1B1B1F;--ink2:#3C3D42;--mute:#6B6F76;--faint:#A0A3A9;--line:#ECECEF;--line2:#E2E2E6;--chip:#F2F2F4;--danger:#E5484D;--warn:#F2BE00;--done:var(--accent);--sh:0 8px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--side:#0E0F11;--panel:#17181B;--hover:rgba(255,255,255,.04);--sel:rgba(255,255,255,.07);--ink:#ECEDEF;--ink2:#C9CBD0;--mute:#8A8F98;--faint:#5C6068;--line:#1F2125;--line2:#2A2C31;--chip:#1F2125;--sh:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07)}}
:root[data-theme=dark]{--bg:#121316;--side:#0E0F11;--panel:#17181B;--hover:rgba(255,255,255,.04);--sel:rgba(255,255,255,.07);--ink:#ECEDEF;--ink2:#C9CBD0;--mute:#8A8F98;--faint:#5C6068;--line:#1F2125;--line2:#2A2C31;--chip:#1F2125;--sh:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:none}
.shell{display:flex;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
/* sidebar */
#side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:10px 8px;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px 10px}
.ws .av{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ws b{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--hover);color:var(--ink)}
.srch{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:7px;color:var(--mute);border:1px solid var(--line2);background:var(--bg);margin-bottom:12px}
.srch kbd,.kbd{margin-left:auto;font:500 11px/1 Inter,sans-serif;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:2px 4px}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:7px;color:var(--ink2);font-weight:500;text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--ink)}
.nav .n{margin-left:auto;color:var(--faint);font-size:12px;font-weight:500}
.nav .n.red{color:var(--danger)}
.nav svg{color:var(--mute)}
.sh{font-size:12px;font-weight:500;color:var(--faint);padding:16px 8px 6px;display:flex;align-items:center}
.sh button{margin-left:auto;color:var(--faint);font-size:16px;line-height:1;width:20px;height:20px;border-radius:5px}
.sh button:hover{background:var(--hover);color:var(--ink)}
.pq{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none;display:grid;place-items:center;color:#fff;font-size:8px;font-weight:700}
.sidefoot{margin-top:auto;padding-top:12px}
.backdrop{display:none}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:3}
.tt{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.tt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.segs{display:flex;background:var(--chip);border-radius:7px;padding:2px}
.segs button{padding:3px 9px;border-radius:5px;color:var(--mute);font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px}
.segs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;border:1px solid var(--line2);color:var(--ink2);font-size:13px;font-weight:500;background:var(--bg);white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill.ghost{border-color:transparent}
.primary{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;background:var(--accent);color:#fff;font-weight:500;font-size:13px}
.primary:hover{filter:brightness(1.08)}
.mob{display:none}
/* list */
.grp{display:flex;align-items:center;gap:8px;padding:0 16px 0 22px;height:36px;background:var(--side);border-bottom:1px solid var(--line);font-weight:500;color:var(--ink2);position:sticky;top:48px;z-index:2}
.grp .c{color:var(--faint);font-weight:500}
.grp .add{margin-left:auto}
.grp.drag,.bcol.drag{box-shadow:inset 0 0 0 2px var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;min-height:40px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.tid{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;width:62px;flex:none;white-space:nowrap}
.stb{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;flex:none}
.stb:hover{background:var(--sel)}
.rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row.done .rt,.row.cancel .rt{color:var(--mute)}
.rmeta{display:flex;align-items:center;gap:6px;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:1px 8px 1px 6px;white-space:nowrap;background:var(--bg)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag.over{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.tag.today{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.mini{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--faint)}
.empty{padding:70px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;font-weight:600}
.empty .primary{margin-top:14px}
/* board */
.board{display:flex;gap:12px;padding:14px 16px;overflow-x:auto;align-items:flex-start;flex:1}
.bcol{width:300px;flex:none;border-radius:10px;padding:2px}
.bcol h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink2);margin:4px 6px 10px}
.bcol h3 .c{color:var(--faint)}
.bcol h3 .ib{margin-left:auto;width:24px;height:24px}
.bcard{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.bcard:hover{border-color:var(--faint)}
.bcard .h{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px;margin-bottom:6px}
.bcard .h .stb{margin-left:auto}
.bcard .t{font-weight:500;line-height:1.4;margin-bottom:8px;word-wrap:break-word}
.bcard .f{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bcard.done .t{color:var(--mute)}
/* calendar */
.calbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.calbar b{font-size:15px;font-weight:600;min-width:120px;text-align:center}
.calbar .ib{font-size:20px;line-height:1}
.cal{padding:0 16px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--faint);font-weight:500;padding:8px 0 6px}
.cal-h span{padding-left:8px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px 6px;cursor:pointer;min-width:0}
.cell:hover{background:var(--hover)}
.cell.out{background:var(--side)}.cell.out .dn span{color:var(--faint)}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell.drag{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dn{display:flex;align-items:center;justify-content:space-between;height:24px}
.dn span{font-size:12.5px;font-weight:500;color:var(--ink2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn span{background:var(--accent);color:#fff;font-weight:600}
.cadd{width:20px;height:20px;opacity:0}
.cell:hover .cadd{opacity:1}
.chips{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.cchip{font-size:12px;line-height:1.3;padding:3px 6px 3px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 13%,var(--panel));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2.5px solid var(--c);cursor:pointer}
.cchip:hover{background:color-mix(in srgb,var(--c) 22%,var(--panel))}
.cchip .tm{color:var(--mute);margin-right:4px;font-variant-numeric:tabular-nums}
.cchip.done,.cchip.cancel{opacity:.55;text-decoration:line-through}
.cchip.over .tm{color:var(--danger)}
.more{font-size:11.5px;color:var(--mute);padding-left:6px}
.dots{display:none}
.agenda{margin:18px 0 40px;border-top:1px solid var(--line)}
/* panel */
#panelWrap .scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:20}
.pnl{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:var(--sh);z-index:21;display:flex;flex-direction:column;animation:slide .18s ease-out;padding-top:env(safe-area-inset-top)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.ph{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px 0 18px;border-bottom:1px solid var(--line);color:var(--mute);font-size:13px;flex:none}
.ph .crumb{display:flex;align-items:center;gap:7px;min-width:0}
.pb{flex:1;overflow:auto;padding:22px 28px calc(40px + env(safe-area-inset-bottom))}
.ttl-in{width:100%;border:0;outline:0;background:none;resize:none;font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.3;padding:0;overflow:hidden}
.desc-in{width:100%;border:0;outline:0;background:none;resize:none;font-size:15px;line-height:1.55;padding:0;margin-top:10px;color:var(--ink2);min-height:60px;overflow:hidden}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.props .pill{position:relative}
.props input[type=datetime-local]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.sec{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:10px}
.sec-h span{color:var(--faint);font-weight:500}
.ck{display:flex;align-items:center;gap:10px;padding:4px 0}
.ck input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);margin:0;flex:none;cursor:pointer;display:grid;place-items:center}
.ck input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
.ck input[type=checkbox]:checked::after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(1px,-1px)}
.ck .ckt{flex:1;border:0;outline:0;background:none;padding:3px 0;font-size:14px}
.ck.on .ckt{color:var(--mute);text-decoration:line-through}
.ck .x{opacity:0;color:var(--faint);width:22px;height:22px;border-radius:5px}
.ck:hover .x{opacity:1}
.addin{width:100%;border:0;outline:0;background:none;padding:6px 0;color:var(--ink);font-size:14px}
.addin::placeholder{color:var(--faint)}
.lkr{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:6px}
.lkr .fv{width:20px;height:20px;border-radius:5px;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mute);flex:none}
.lkr a{flex:1;min-width:0;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkr a small{color:var(--faint);margin-left:6px}
.lkr .x{color:var(--faint);width:22px;height:22px;border-radius:5px}
.rmd{display:flex;flex-wrap:wrap;gap:8px}
.rmd .pill{text-decoration:none}
.note{font-size:12.5px;color:var(--faint);margin-top:8px;line-height:1.5}
.danger{color:var(--danger)}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.modal{width:100%;max-width:640px;background:var(--panel);border-radius:12px;box-shadow:var(--sh);overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:0}}
.mh{display:flex;align-items:center;gap:8px;padding:12px 16px 0;color:var(--mute);font-size:13px}
.mb{padding:12px 18px 6px}
.mb .ttl-in{font-size:18px}
.mb .desc-in{font-size:14px;min-height:44px}
.mf{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .props{margin:0;flex:1}
/* palette */
.pal input{width:100%;border:0;outline:0;background:none;font-size:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:7px;text-align:left;color:var(--ink2)}
.pal .it.on{background:var(--sel);color:var(--ink)}
.pal .it .tid{width:auto}
.pal .grp-l{font-size:12px;color:var(--faint);padding:8px 12px 4px}
/* popover */
.pop{position:fixed;z-index:40;background:var(--panel);border-radius:9px;box-shadow:var(--sh);padding:4px;min-width:200px;max-height:60vh;overflow:auto;animation:pop .1s ease-out}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;text-align:left;color:var(--ink2)}
.pop button:hover,.pop button.on{background:var(--sel);color:var(--ink)}
.pop button em{margin-left:auto;font-style:normal;color:var(--mute)}
.popscrim{position:fixed;inset:0;z-index:39}
/* date picker */
.pop.dp{width:330px;padding:10px}
.dpq{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.dpq button,.dpt button{width:auto;padding:5px 9px;border-radius:6px;background:var(--chip);font-size:12.5px;font-weight:500;color:var(--ink2)}
.dpq button:hover,.dpt button:hover{background:var(--sel)}
.dph{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
.dph b{font-size:13px;font-weight:600}
.dph button{width:28px;height:28px;padding:0;justify-content:center;font-size:18px}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dpg span{font-size:11px;color:var(--faint);padding:2px 0 4px}
.dpg button{width:100%;padding:0;height:32px;justify-content:center;border-radius:7px;font-size:13px;color:var(--ink)}
.dpg button.out{color:var(--faint)}
.dpg button.td{color:var(--accent);font-weight:700}
.dpg button.on{background:var(--accent);color:#fff}
.dpt{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.dpt span{font-size:12px;color:var(--mute);margin-right:2px}
.dpt button.on{background:var(--accent);color:#fff}
.dpin{border:1px solid var(--line2);border-radius:6px;padding:3px 6px;background:var(--bg);font-size:12.5px;margin-left:auto}
.pop.dp.sheet{width:auto}
/* settings */
.set .f{margin-bottom:16px}
.set label.l{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:6px}
.inp{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);outline:0;font-size:14px}
.inp:focus{border-color:var(--accent)}
.prow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.prow input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;flex:none}
.prow .k{width:70px;flex:none;text-transform:uppercase}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.box{border:1px solid var(--line2);border-radius:9px;padding:12px;margin-bottom:12px}
.box p{margin:0 0 8px;font-weight:600}
/* misc */
.fab{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:500;z-index:50;display:none;box-shadow:var(--sh);max-width:90vw}
.save{position:fixed;left:250px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;color:var(--faint);z-index:4;pointer-events:none;transition:opacity .3s}
@media(max-width:860px){
 #side{position:fixed;left:0;top:0;bottom:0;z-index:25;transform:translateX(-100%);transition:transform .2s;width:280px;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:none}
 .drawer #side{transform:none;box-shadow:var(--sh)}
 .drawer .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:24}
 .mob{display:grid}.desk{display:none}
 .top{padding:0 8px}
 .row{flex-wrap:wrap;padding:9px 14px;gap:4px 10px;align-items:flex-start}
 .row>.stb{order:1;margin-top:-1px}.row .rt{order:2;white-space:normal;font-size:15px;flex-basis:calc(100% - 40px)}
 .row>.pri.stb{order:3;margin:0 0 0 32px}.row .tid{order:4;width:auto;line-height:22px}
 .row .rmeta{order:5;flex-wrap:wrap}
 .tt>svg{display:none}
 .grp{padding:0 14px}
 .board{padding:12px}
 .bcol{width:82vw;max-width:320px}
 .pb{padding:18px 18px calc(40px + env(safe-area-inset-bottom))}
 .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;font-weight:300;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:10}
 .mwrap{padding:0;align-items:flex-end}
 .modal{border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom)}
 .pop.sheet{left:8px!important;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));top:auto!important;border-radius:12px;padding:6px}
 .pop.sheet button{padding:11px 12px;font-size:15px}
 .save{left:50%;transform:translateX(-50%)}
 .cal{padding:0}.cal-g{border-left:0}.cell{min-height:54px;padding:3px 2px;display:flex;flex-direction:column;align-items:center}.dn{justify-content:center}.cadd,.chips{display:none}.dots{display:flex;gap:3px;justify-content:center;margin-top:3px}.dots i{width:5px;height:5px;border-radius:50%}.cal-h span{padding:0;text-align:center}.calbar{padding:8px 10px}.agenda{margin-top:12px}
}

/* modules */
.chip{flex:none;padding:5px 11px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
